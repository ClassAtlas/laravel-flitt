name: Bug report
description: Something in the package does not work as its README says.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real merchant key, signature, card token, or a callback body with a payer's data.**
        Flitt's public test merchant (`1549901`, key `test`) is enough to show a problem with this package.
        A security problem goes to [a private report](https://github.com/ClassAtlas/laravel-flitt/security/advisories/new), not here.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.40.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.5.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The call you made, what came back, and the exception and its message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code that shows it, ideally against the test merchant.
      render: php
